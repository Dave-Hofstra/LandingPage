<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Slot machine body -->
  <rect x="10" y="18" width="80" height="65" rx="8" fill="#1a1a2e" stroke="#c9a84c" stroke-width="2"/>
  <!-- Top light / sign -->
  <rect x="18" y="8" width="64" height="14" rx="4" fill="#c9a84c"/>
  <text x="50" y="19" text-anchor="middle" fill="#1a1a2e" font-size="8" font-weight="bold" font-family="sans-serif">SLOTS</text>
  <!-- Reel window -->
  <rect x="14" y="26" width="72" height="38" rx="4" fill="#0a0a14" stroke="#c9a84c" stroke-width="1"/>
  <!-- Reels -->
  <rect x="17" y="29" width="20" height="32" rx="2" fill="#222"/>
  <rect x="40" y="29" width="20" height="32" rx="2" fill="#222"/>
  <rect x="63" y="29" width="20" height="32" rx="2" fill="#222"/>
  <!-- Reel symbols - cherries, BAR, 7 -->
  <text x="27" y="52" text-anchor="middle" fill="#ff4444" font-size="18" font-family="sans-serif">&#9829;</text>
  <text x="50" y="52" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="monospace">BAR</text>
  <text x="73" y="52" text-anchor="middle" fill="#ff4444" font-size="18" font-family="sans-serif">7</text>
  <!-- Payline indicator -->
  <line x1="14" y1="48" x2="86" y2="48" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Handle -->
  <rect x="88" y="35" width="6" height="15" rx="2" fill="#888"/>
  <circle cx="91" cy="35" r="5" fill="#c9a84c"/>
  <!-- Bottom panel -->
  <rect x="14" y="68" width="72" height="10" rx="2" fill="#222"/>
  <text x="50" y="76" text-anchor="middle" fill="#c9a84c" font-size="6" font-family="sans-serif" font-weight="bold">SPIN</text>
</svg>
